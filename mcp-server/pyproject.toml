[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "management-research-kb-mcp"
version = "0.1.0"
description = "Read-first local MCP server for an Obsidian, PDF, and Zotero research knowledge base"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.20,<2",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
management-research-kb-mcp = "management_research_kb.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
